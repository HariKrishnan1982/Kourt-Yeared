[package]
name = "kourt-yeared"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
